name: Differential oracle

# Runs our engine and the Python regex module over generated patterns and inputs and diffs the
# results. Scheduled and on demand only, never a merge gate: the oracle needs Python, it is
# property-based so its runtime varies, and a flaky ground truth must not be able to block a
# merge. Every divergence it finds is minimised into an ordinary permanent test instead.

on:
  schedule:
    # 03:00 UTC on Mondays.
    - cron: '0 3 * * 1'
    # 03:00 UTC on Thursdays, for the seed sweep below. A separate day rather than a second job on
    # Monday so the two never contend for a runner and a red sweep is not read as a red wave.
    - cron: '0 3 * * 4'
  workflow_dispatch:
    inputs:
      seedCount:
        description: 'Seeds for the sweep job (the schedule uses 6)'
        required: false
        default: '6'
      masterSeed:
        description: 'Master seed for the sweep job, or blank for the run date'
        required: false
        default: ''

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  oracle:
    name: Oracle vs Python regex
    runs-on: ubuntu-latest
    # Monday's cron and any manual run. Thursday's cron is the sweep alone.
    if: github.event.schedule != '0 3 * * 4'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the oracle from the pinned upstream source
        # Built from upstream/, not installed from PyPI, so the ground truth is exactly the
        # commit this port targets. Free here: the Linux runners already have a C compiler.
        # PyPI is not always an option anyway - upstream tags releases that are never published,
        # which is true of the currently pinned 2026.8.12.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./upstream

      - name: The oracle must be the pinned upstream version
        # A silently mismatched oracle would produce divergences that are version drift rather
        # than port defects, and cost a session to chase down.
        run: |
          python - <<'CHECK'
          import pathlib, re, regex
          pinned = re.search(r'^version = "(.+)"',
                             pathlib.Path('upstream/pyproject.toml').read_text(encoding='utf-8'),
                             re.M).group(1)
          print(f"oracle {regex.__version__}, pinned upstream {pinned}")
          assert regex.__version__ == pinned, "the oracle is not the pinned upstream version"
          CHECK

      - name: The compile-parity corpus must be current
        # The corpus is the only oracle Phase 2 has, so a stale one would send every parser slice
        # chasing divergences that are really upstream drift. Regenerated here against the oracle
        # built from upstream/ above, and diffed byte for byte against what is committed.
        run: python tools/record-compile-corpus.py --check

      - name: The corpus recorder must be deterministic
        # Two runs under different PYTHONHASHSEED values must agree. If a future upstream adds a
        # fourth place where a set becomes an ordered list, this is what says so.
        run: python tools/record-compile-corpus.py --verify-determinism

      - name: The transliterated Unicode tables must be current
        # src/FuzzyRegex/Unicode/*.g.cs is upstream/src/_regex_unicode.c, mechanically. This
        # re-runs the transliteration against the pinned submodule and diffs it byte for byte, so
        # a hand-edit or a stale file cannot survive a week.
        run: python tools/transliterate-unicode.py --check

      - name: The character-name table must be current
        # Downloads the Unicode 17.0.0 UCD and re-verifies every name against this runner's own
        # unicodedata - an implementation independent of those files - before diffing the table.
        run: python tools/build-character-names.py --check

      - name: The lowercase table must be current
        # Downloads the Unicode 17.0.0 UCD and re-verifies the mapping against this runner's own
        # str.lower() - an implementation independent of those files - before diffing the table.
        run: python tools/build-lowercase.py --check

      - name: The Unicode fixtures must be current
        # The casing, property and str-predicate digests, taken from the oracle built above
        # rather than from a developer's locally installed regex.
        run: python tools/record-unicode-fixtures.py --check

      - name: The wave recorder's guards must fire
        # Four properties the recorder must hold rather than be trusted on: it refuses a named list
        # whose name collides with a regex.compile parameter, it refuses a pattern that dies on
        # CPython's recursion limit, the seed it prints beside a generator reproduces that
        # generator's rows on its own, and it translates codepoint indices to UTF-16. Each would
        # otherwise be a silent wrong answer, not a crash. All four were raised by the S14 blind
        # review.
        run: python tools/record-oracle.py --self-check

      - name: The wave recorder must be deterministic
        # Two runs of one seed, in fresh interpreters under different PYTHONHASHSEED values, must
        # produce byte-identical waves. A wave nobody can re-record is a divergence nobody can
        # reproduce.
        run: python tools/record-oracle.py --verify-determinism

      - name: Run the oracle
        # Records a wave from the oracle built above and diffs this port's matching against it.
        # The seed is random per run and recorded in the wave header, so each week explores rows
        # last week did not and any divergence stays reproducible from the uploaded artifact.
        # Every divergence fails the job; a row this port cannot answer yet is reported as
        # unsupported and does not.
        run: pwsh -File tools/run-oracle.ps1 -Configuration Release -Count 2000

      - name: Upload divergences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-divergences
          path: TestResults/
          if-no-files-found: ignore

  sweep:
    name: Seed sweep
    runs-on: ubuntu-latest
    # Thursday's cron and any manual run. Monday's cron is the single wave alone.
    if: github.event.schedule != '0 3 * * 1'
    # A seed costs about two and a half minutes at 2000 rows a generator, so six is about a quarter
    # of an hour. Generous rather than tight, because a sweep that times out mid-seed logs nothing
    # for it and the resumption path is not available to a fresh runner.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the oracle from the pinned upstream source
        # Same as the job above, and for the same reason: the ground truth must be the commit this
        # port targets. The table and corpus checks are NOT repeated here - Monday's job owns those,
        # and a sweep is about seeds rather than about staleness.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./upstream

      - name: The oracle must be the pinned upstream version
        run: |
          python - <<'CHECK'
          import pathlib, re, regex
          pinned = re.search(r'^version = "(.+)"',
                             pathlib.Path('upstream/pyproject.toml').read_text(encoding='utf-8'),
                             re.M).group(1)
          print(f"oracle {regex.__version__}, pinned upstream {pinned}")
          assert regex.__version__ == pinned, "the oracle is not the pinned upstream version"
          CHECK

      - name: Sweep fresh seeds
        # THE SEED COUNT IS THE INSTRUMENT, not the row count - S43's closing note, and the lesson
        # S33, S34, S35, S40a and S43 each paid for separately. Six fresh seeds a week is over three
        # hundred a year that no slice has ever run, and the master seed is the run date, so a red
        # seed is re-drawn from one number in the log. The bigger sweeps - twenty seeds and up - are
        # run detached by the orchestrator, not here.
        run: |
          MASTER="${{ github.event.inputs.masterSeed }}"
          if [ -z "$MASTER" ]; then MASTER=$(date -u +%Y%m%d); fi
          COUNT="${{ github.event.inputs.seedCount }}"
          if [ -z "$COUNT" ]; then COUNT=6; fi
          pwsh -File tools/sweep-seeds.ps1 \
            -SeedCount "$COUNT" -MasterSeed "$MASTER" -Count 2000 -Configuration Release

      - name: Upload the sweep log and every red seed's wave
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-sweep
          path: TestResults/oracle/
          if-no-files-found: ignore
