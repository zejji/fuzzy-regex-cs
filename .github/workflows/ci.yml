name: CI

# The merge gate: build, test and the parity ratchet on all three operating systems.
# A change cannot land if any previously-passing test stops passing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-and-ratchet:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # upstream/ is the reference the port is measured against, and check-ratchet.ps1
          # stamps its commit into the status board.
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Restore local tools
        run: dotnet tool restore

      - name: Formatting must be clean
        # The real formatting gate. The pre-commit hook is absent in a fresh clone until
        # `dotnet husky install` runs and is one --no-verify away from being skipped, so it
        # cannot be the thing that holds the line. This can.
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Tooling tests (Pester)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0.0')) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0
          }
          ./tools/run-tool-tests.ps1

      - name: Test and enforce the parity ratchet
        shell: pwsh
        run: ./tools/check-ratchet.ps1 -Configuration Release

      - name: The generated status board must be up to date
        shell: pwsh
        run: |
          # check-ratchet.ps1 rewrites docs/STATUS.md. If that changes anything, the committed
          # board was stale - regenerate it and commit rather than letting the numbers drift.
          $diff = git diff --name-only -- docs/STATUS.md
          if ($diff) {
            git --no-pager diff -- docs/STATUS.md
            throw 'docs/STATUS.md is out of date. Run tools/check-ratchet.ps1 and commit the result.'
          }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn

  native-aot:
    # The DYNAMIC half of the Native AOT gate (ROADMAP, amendment 12; S53). The static half is
    # <IsAotCompatible>true</IsAotCompatible> on src/FuzzyRegex, which the build-and-ratchet job
    # above already enforces through TreatWarningsAsErrors. Static analysis cannot see a
    # runtime-only failure, so this job publishes real ILCompiler binaries and runs them.
    #
    # Both platforms, because the ILCompiler and the linker it drives are platform-specific: a
    # green win-x64 leg is not evidence for linux-x64. macOS is left out deliberately - it is the
    # third leg above for the managed suite, and a third native compile roughly doubles this job's
    # wall clock for a platform no Phase 7 measurement targets. Revisit in Phase 8 if the package
    # claims macOS AOT support.
    name: Native AOT (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: The whole suite, published natively and run
        # 6,155 tests under the same trimming and reflection constraints a consumer's AOT app
        # enforces. Stronger than any sample: a sample only asserts the cases somebody thought of.
        shell: pwsh
        run: ./tools/run-aot-tests.ps1 -Rid ${{ matrix.rid }}

      - name: The consumer smoke app, published natively and run
        # What only a separate consumer can show: a project reference from outside the test tree,
        # nothing rooted in the trimmer, and the binary size and startup time a user would see.
        shell: pwsh
        run: ./tools/run-aot-smoke.ps1 -Rid ${{ matrix.rid }}

  inspections:
    name: ReSharper inspections (IDE0320 and other IDE-only errors must fail here)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore and build
        run: |
          dotnet restore
          dotnet build --no-restore
      - name: Install the ReSharper command-line tools
        run: dotnet tool install -g JetBrains.ReSharper.GlobalTools
      - name: Inspections must be clean at ERROR severity
        shell: pwsh
        run: ./tools/check-inspections.ps1
